  }
  function md(s) {
    return esc(s).replace(/\[b\](.*?)\[\/b\]/g, '<b>$1</b>').replace(/\[i\](.*?)\[\/i\]/g, '<i>$1</i>');
  }
  function paras(s) { return s.split('\n').map(function (p) { return '<p>' + md(p) + '</p>'; }).join(''); }
  function fmt(n) { return Number(n).toLocaleString('en-US'); }
  function user(name) { return USERS[name] || { rank: 'Initiate', joined: 'recently', posts: 1, karma: 1, color: '#6b6b6b' }; }

  var UP = '<svg width="16" height="15" viewBox="0 0 16 15"><path d="M8 0L16 8.5H11V15H5V8.5H0Z"/></svg>';
  var DOWN = '<svg width="16" height="15" viewBox="0 0 16 15"><path d="M8 15L0 6.5H5V0H11V6.5H16Z"/></svg>';

  // Post #1 is the original post; POSTS follow as #2, #3, ...
  var all = [[OP.author, OP.points, OP.time, OP.body.join('\n'), 0, { op: true }]].concat(POSTS);

  function tags(name) {
    var u = user(name), t = '';
    if (name === OP.author) t += ' <span class="tag op">OP</span>';
    if (u.mod) t += ' <span class="tag mod">MOD</span>';
    return t;
  }

  function postHtml(p, i) {
    var name = p[0], pts = p[1], time = p[2], text = p[3], q = p[4], opt = p[5] || {};
    var num = i + 1, u = user(name), row = i % 2 ? 'row2' : 'row1';
    var gone = opt.deleted || opt.removed;

    var quote = '';
    if (q && all[q - 1]) {
      var src = all[q - 1], srcGone = src[5] && (src[5].deleted || src[5].removed);
      var srcText = srcGone ? '[deleted]' : src[3];
      if (srcText.length > 180) srcText = srcText.slice(0, 180).replace(/\s+\S*$/, '') + '...';
      quote = '<div class="quote"><div class="quote-head">' + esc(srcGone ? '[deleted]' : src[0]) + ' wrote (#' + q + '):</div>' + md(srcText) + '</div>';
    }

    var body = opt.deleted ? '<p class="removed">[deleted]</p>'
      : opt.removed ? '<p class="removed">[removed by moderator - Rule 3]</p>'
      : (opt.op ? '<div class="op-title">' + esc(OP.title) + '</div>' : '') + quote + paras(text) +
        (opt.image ? '<div class="attach"><div class="attach-head">Attachment: <a href="#">' + esc(opt.image) + '</a></div>' +
          '<img src="' + esc(opt.image) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;attach-missing&quot;>' + esc(opt.image) + ' not found</div>\'"></div>' : '');

    var author = gone
      ? '<div class="name">[deleted]</div><div class="rank">&nbsp;</div><div class="avatar" style="background:var(--gone)"></div>'
      : '<div class="name"><a href="#">' + esc(name) + '</a>' + tags(name) + '</div>' +
        '<div class="rank">' + esc(u.rank) + '</div>' +
        '<div class="avatar" style="background:' + u.color + '">' + esc(name.replace(/[^A-Za-z]/g, '').charAt(0).toUpperCase()) + '</div>' +
        '<div class="meta">Joined: ' + esc(u.joined) + '<br>Posts: ' + fmt(u.posts) + '<br>Karma: ' + fmt(u.karma) + '</div>';

    return '<tr class="post-row" id="p' + num + '">' +
      '<td class="' + row + ' author-col">' + author + '</td>' +
      '<td class="' + row + ' post-col">' +
        '<div class="post-head"><span>Posted: <b>' + esc(time) + '</b>' +
          (opt.op ? '' : ' &middot; Post subject: Re: ' + esc(OP.title)) + '</span>' +
          '<span class="num">' + (opt.modNote ? '<span class="mod-note">MOD NOTE &middot; </span>' : '') + '<a href="#p' + num + '">#' + num + '</a></span></div>' +
        '<div class="post-main">' +
          '<div class="votes"><button class="arrow up" aria-label="upvote">' + UP + '</button>' +
            '<div class="score' + (pts < 0 ? ' neg' : '') + '" data-base="' + pts + '">' + (gone ? '&bull;' : fmt(pts)) + '</div>' +
            '<button class="arrow down" aria-label="downvote">' + DOWN + '</button></div>' +
          '<div class="post-text' + (pts < -5 || gone ? ' faded' : '') + '">' + body + '</div>' +
        '</div>' +
        (opt.edited ? '<div class="edited">Last edited by ' + esc(name) + ' ' + esc(opt.edited) + '</div>' : '') +
        (u.sig && !gone ? '<div class="sig">' + esc(u.sig) + '</div>' : '') +
        '<div class="post-foot"><span><a href="#">profile</a><a href="#">pm</a></span>' +
          '<span><a href="#">quote</a><a href="#">reply</a><a href="#">share</a><a href="#">report</a></span></div>' +
      '</td></tr>' +
      '<tr class="spacer"><td colspan="2"></td></tr>';
  }

  // ---- fill page ----
  var full = SITE.prefix + SITE.community;
  document.title = OP.title + ' : ' + SITE.community;
  $('site-name').textContent = SITE.name;
  $('site-tag').textContent = SITE.tagline;
  $('community-name').textContent = full;
  $('community-desc').textContent = SITE.description;
  $('community-stats').innerHTML = '<b>' + SITE.members + '</b> ' + esc(SITE.membersWord) + ' &nbsp; <span class="online-dot"></span><b>' + SITE.online + '</b> ' + esc(SITE.onlineWord) +
    ' <button class="joinbtn" type="button">Join</button>';
  $('flair').textContent = OP.flair;
  $('thread-title').textContent = OP.title;
  var crumbs = '<a href="#">' + esc(SITE.name) + ' Index</a> &raquo; <a href="#">' + esc(SITE.category) + '</a> &raquo; <a href="#">' + esc(full) + '</a>';
  $('crumbs').innerHTML = crumbs;
  $('crumbs-bottom').innerHTML = crumbs;
  var pager = 'Page <b>1</b> of <b>1</b> &middot; ' + POSTS.length + ' replies &middot; ' + OP.views + ' views';
  $('pager').innerHTML = pager;
  $('pager-bottom').innerHTML = pager;

  $('thread').insertAdjacentHTML('beforeend', all.map(postHtml).join(''));

  $('online').innerHTML = 'Users browsing this community: ' + SITE.onlineNames.map(function (n) { return '<a href="#"><b>' + esc(n) + '</b></a>'; }).join(', ') +
    ' and ' + SITE.guests + ' guests<br><span style="color:var(--meta)">Most users ever online was <b>666</b> on the night of the last new moon.</span>';
  $('footer').innerHTML = esc(SITE.name) + ' &middot; <a href="#">rules</a> &middot; <a href="#">help</a> &middot; <a href="#">privacy</a> &middot; <a href="#">terms</a>';

  // ---- dark mode toggle (remembered on this computer) ----
  function setTheme(dark) {
    if (dark) document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    $('theme-toggle').textContent = dark ? 'Light mode' : 'Dark mode';
    try { localStorage.setItem('theme', dark ? 'dark' : 'light'); } catch (e) {}
  }
  $('theme-toggle').textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Light mode' : 'Dark mode';
  $('theme-toggle').addEventListener('click', function () {
    setTheme(document.documentElement.getAttribute('data-theme') !== 'dark');
  });

  // ---- interactions (reset on reload) ----
  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href="#"]');
    if (a) e.preventDefault();

    var arrow = e.target.closest('.arrow');
    if (!arrow) return;
    var box = arrow.parentNode;
    var up = box.querySelector('.up'), down = box.querySelector('.down'), score = box.querySelector('.score');
    if (score.textContent === '•') return;
    var wasOn = arrow.classList.contains('on');
    up.classList.remove('on'); down.classList.remove('on');
    if (!wasOn) arrow.classList.add('on');
    var delta = up.classList.contains('on') ? 1 : down.classList.contains('on') ? -1 : 0;
    score.textContent = fmt(parseInt(score.getAttribute('data-base'), 10) + delta);
    score.classList.toggle('liked', delta > 0);
    score.classList.toggle('disliked', delta < 0);
  });
})();
</script>
</body>
</html>
